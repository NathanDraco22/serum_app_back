[project]
name = "serum-business"
version = "0.1.0"
description = "Business logic and data access layer for Serum server"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.0",
    "orjson>=3.10.15",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
]

[tool.ty.environment]
extra-paths = [".venv/Lib/site-packages", "./src"]

[tool.uv.sources]
